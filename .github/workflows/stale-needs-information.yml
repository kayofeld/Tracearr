name: Stale - needs-information

# Issues labelled needs-information that go quiet for 14 days get a nudge,
# then close 7 days later. Any reply resets the clock. PRs are never touched.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          any-of-labels: needs-information
          exempt-issue-labels: planned,high-priority,priority,needs-confirmation
          days-before-stale: 14
          days-before-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          close-issue-reason: not_planned
          stale-issue-message: >-
            This issue is waiting on information from the reporter (see the
            `needs-information` label) and has had no reply for two weeks. It
            will close in 7 days. Reply with the missing details, usually logs
            and your Tracearr version, and it stays open.
          close-issue-message: >-
            Closed for lack of information. If you still see the problem,
            comment with the details asked for above and a maintainer will
            reopen it.

name: Vouch - Check Issue

# Bug reports stay open to everyone. Only denounced users (a "-" line in
# .github/VOUCHED.td) get their issues closed and locked on open. That's the
# "one warning, then we block" line in CONTRIBUTING.md, automated.
on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.VOUCH_APP_ID }}
          private-key: ${{ secrets.VOUCH_APP_PRIVATE_KEY }}

      - uses: mitchellh/vouch/action/check-issue@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
        with:
          issue-number: ${{ github.event.issue.number }}
          require-vouch: false
          auto-close: true
          auto-lock: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
